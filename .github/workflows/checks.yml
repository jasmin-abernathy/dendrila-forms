name: Contrôles PHP
on:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'forms/**'
      - 'tests/**'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'forms/**'
      - 'tests/**'
      - '.github/workflows/checks.yml'
concurrency:
  group: forms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP
        run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Modèles JSON
        run: php -r 'foreach(glob("forms/*.json") as $f) json_decode(file_get_contents($f),true,512,JSON_THROW_ON_ERROR);'
      - name: Smoke tests
        run: php tests/smoke.php
